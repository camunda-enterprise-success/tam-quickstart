global:
  secrets:
    autoGenerated: true
    name: camunda-credentials
  security:
    authentication:
      method: oidc
  identity:
    auth:
      enabled: true
      type: "KEYCLOAK"
      publicIssuerUrl: "https://local.distro.ultrawombat.com/auth/realms/camunda-platform"
      issuer: "https://local.distro.ultrawombat.com/auth/realms/camunda-platform"
      optimize:
        redirectUrl: "https://local.distro.ultrawombat.com/optimize"
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-optimize-client-token
  ingress:
    enabled: true
    className: ""
    host: "local.distro.ultrawombat.com"
    tls:
      enabled: true
      secretName: camunda-platform

connectors:
  enabled: true
  inbound:
    mode: disabled
  security:
    authentication:
      oidc:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-connectors-client-token

# Configure elastic search to make it running for local development
elasticsearch:
  # Request a single node with a persistent volume
  master:
    replicaCount: 1
    persistence:
      size: 15Gi

identity:
  logging:
    level:
      ROOT: DEBUG
      io.camunda.identity: DEBUG
  enabled: true
  contextPath: "/identity"
  fullURL: "https://local.distro.ultrawombat.com/identity"
  firstUser:
    secret:
      existingSecret: camunda-credentials
      existingSecretKey: identity-firstuser-password

identityKeycloak:
  enabled: true

optimize:
  enabled: true
  contextPath: "/optimize"

# Reduce for Zeebe and Gateway the configured replicas and with that the required resources
# to get it running locally
orchestration:
  contextPath: "/orchestration"
  clusterSize: "1"
  partitionCount: "1"
  replicationFactor: "1"
  pvcSize: 10Gi
  ingress:
    grpc:
      enabled: true
      className: ""
      host: "zeebe.local.distro.ultrawombat.com"
      tls:
        enabled: true
        secretName: camunda-platform
  security:
    authentication:
      oidc:
        secret:
          existingSecret: camunda-credentials
          existingSecretKey: identity-orchestration-client-token
        redirectUrl: https://local.distro.ultrawombat.com/orchestration

